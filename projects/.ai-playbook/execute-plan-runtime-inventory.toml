[deferrals.pi]
id = "pi"
display_name = "Pi"
aliases = ["pi"]
source_catalogs = ["agterm"]
eligibility = "deferred"
reason = "Execute-plan resume behavior is not documented or verified for Pi."

[[hook_profiles]]
agent = "Claude"
hook = "lessons-recall"
expected = "FULL"
runtime_id = "claude"
adapter = "~/.claude/hooks/lessons-recall.sh"
