# Authoritative runtime identity and capability registry for execute-plan.
# Capability values belong here only. Runtime prose and probes are validated views.

[inventory]
schema_version = 1
contract_version = "1.0"
capability_owner = "registry"
registry_path = "projects/.ai-playbook/execute-plan-runtime-inventory.toml"
canonical_ids = ["claude", "codex", "cursor", "zcode", "opencode", "copilot", "gemini", "antigravity"]
deferred_ids = ["pi"]

[runtimes.claude]
id = "claude"
display_name = "Claude Code"
aliases = ["claude", "claude code"]
source_catalogs = ["runtime-layout", "agterm", "hooks-probe"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:claude"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Use a bounded parent handoff when final-response enforcement is unavailable."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
retry_budget = 2

[runtimes.claude.capabilities]
launch = "unsupported"
wait = "unsupported"
resume = "unsupported"
checkpoint = "full"
approval = "full"
parent_continuation = "full"
final_response = "degraded"

[runtimes.codex]
id = "codex"
display_name = "Codex"
aliases = ["codex"]
source_catalogs = ["runtime-layout", "agterm", "hooks-probe"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:codex"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Return a durable receipt when the host cannot enforce terminal finalization."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
retry_budget = 2

[runtimes.codex.capabilities]
launch = "full"
wait = "full"
resume = "full"
checkpoint = "full"
approval = "full"
parent_continuation = "full"
final_response = "degraded"

[runtimes.cursor]
id = "cursor"
display_name = "Cursor"
aliases = ["cursor", "cursor agent", "cursor agent cli"]
source_catalogs = ["runtime-layout", "agterm", "hooks-probe"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:cursor"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Use the file-backed manifest and a parent receipt when the host hook is degraded."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
retry_budget = 2

[runtimes.cursor.capabilities]
launch = "unsupported"
wait = "unsupported"
resume = "unsupported"
checkpoint = "full"
approval = "full"
parent_continuation = "full"
final_response = "degraded"

[runtimes.zcode]
id = "zcode"
display_name = "ZCode"
aliases = ["zcode"]
source_catalogs = ["agterm"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:zcode"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Use an explicit operator resume when the runtime session cannot be recovered."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
retry_budget = 2

[runtimes.zcode.capabilities]
launch = "unsupported"
wait = "unsupported"
resume = "unsupported"
checkpoint = "full"
approval = "degraded"
parent_continuation = "full"
final_response = "degraded"

[runtimes.opencode]
id = "opencode"
display_name = "OpenCode"
aliases = ["opencode", "open code"]
source_catalogs = ["runtime-layout", "agterm"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:opencode"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Preserve the checkpoint and require an explicit operator resume if session lookup fails."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
retry_budget = 2

[runtimes.opencode.capabilities]
launch = "unsupported"
wait = "unsupported"
resume = "unsupported"
checkpoint = "full"
approval = "degraded"
parent_continuation = "full"
final_response = "degraded"

[runtimes.copilot]
id = "copilot"
display_name = "Copilot"
aliases = ["copilot", "copilot cli"]
source_catalogs = ["runtime-layout", "agterm"]
eligibility = "eligible"
adapter_entrypoint = "runtime-adapter:copilot"
launch_operation = "launch-worker"
wait_operation = "wait-for-result"
resume_operation = "resume-session"
fallback = "Use a preserved checkpoint and operator resume when approval or finalization is degraded."
adapter_version = "1.0"
approval_policy = "adapter-enforced-default-deny"
